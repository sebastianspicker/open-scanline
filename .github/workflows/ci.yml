name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.91 compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-cargo-
      - run: cargo check --all-targets --all-features --locked
      - run: cargo check --all-targets --no-default-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Verify portable all-feature Rust license bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          vendor_dir="$RUNNER_TEMP/open-scanline-license-vendor"
          cargo vendor --locked --versioned-dirs "$vendor_dir" >/dev/null 2>&1
          OPEN_SCANLINE_LICENSE_SOURCE_DIR="$vendor_dir" \
            python3 scripts/generate_rust_dependency_licenses.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo test --no-default-features --locked
      - run: cargo build --release --all-features --locked
      - run: cargo build --release --no-default-features --locked
      - name: Portable launcher smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --no-default-features --locked -- package \
            --binary target/release/open-scanline \
            --out target/open-scanline-portable.zip
          rm -rf target/portable-smoke
          mkdir -p target/portable-smoke
          unzip -q target/open-scanline-portable.zip -d target/portable-smoke
          target/portable-smoke/open-scanline/run.sh --version
          grep -q '^packaging_host_os=' target/portable-smoke/open-scanline/PORTABLE.txt
          grep -q '^packaging_host_arch=' target/portable-smoke/open-scanline/PORTABLE.txt
      - name: Portable launcher smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --release --no-default-features --locked -- package `
            --binary target/release/open-scanline.exe `
            --out target/open-scanline-portable.zip
          $smoke = 'target/portable-smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          Expand-Archive target/open-scanline-portable.zip -DestinationPath $smoke
          cmd /c target\portable-smoke\open-scanline\run.bat --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content target/portable-smoke/open-scanline/PORTABLE.txt
          if (-not ($manifest -match '^packaging_host_os=')) { throw 'missing packaging_host_os' }
          if (-not ($manifest -match '^packaging_host_arch=')) { throw 'missing packaging_host_arch' }
