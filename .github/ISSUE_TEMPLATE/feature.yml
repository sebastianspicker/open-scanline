name: Feature request
description: Propose a focused improvement to the Rust application.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need or workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, including any backend, platform, or external-tool requirement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
