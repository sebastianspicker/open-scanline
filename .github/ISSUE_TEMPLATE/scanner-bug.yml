name: Scanner bug
description: Report a reproducible acquisition, backend, or output problem.
title: "Scanner bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Open Scanline version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Source or backend
      options:
        - Mock
        - File image
        - WIA
        - SANE
        - eSCL
        - TWAIN host integration
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or GUI steps. Remove passwords, device identifiers, addresses, and document contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted logs
    validations:
      required: true
