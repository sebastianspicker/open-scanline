name: Scanner bug
description: Report a reproducible acquisition, backend, or output problem.
title: "Scanner bug: "
body:
  - type: markdown
    attributes:
      value: |
        This template is for reproducible bugs only. Do not report vulnerabilities
        here — follow [SECURITY.md](https://github.com/sebastianspicker/open-scanline/blob/main/SECURITY.md)
        for private reporting.
  - type: input
    id: version
    attributes:
      label: Open Scanline version
      description: The output of `open-scanline --version`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Source or backend
      options:
        - Mock
        - File image
        - WIA
        - SANE
        - eSCL
        - TWAIN host integration
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or GUI steps. Remove passwords, device identifiers, addresses, and document contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted logs
      description: Paste any error output, with paths, addresses, and device names redacted.
    validations:
      required: true
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, scanner addresses, and document contents from this report.
          required: true
